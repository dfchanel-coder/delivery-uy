name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Enable pnpm
        uses: pnpm/action-setup@v4

      - name: Enable Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build admin panel
        run: pnpm run build:admin
        env:
          NEXT_STANDALONE_OUTPUT: 'false'

      - name: Build backend
        run: pnpm run build

      - name: Unit and API tests
        run: pnpm exec vitest run

      - name: Check formatting
        run: pnpm run format:check

  flutter:
    name: Dart analyze and tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Dart quality gate
        run: node scripts/flutter-check.mjs

  integration:
    name: Infrastructure smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # This job exists because PHASE 01 exit criteria 3 and 5 can only be proven
    # against real PostgreSQL and Redis containers.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: delivery
          POSTGRES_PASSWORD: delivery
          POSTGRES_DB: deliveryuy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U delivery -d deliveryuy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - name: Enable pnpm
        uses: pnpm/action-setup@v4

      - name: Enable Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build backend
        run: pnpm run build

      - name: Validate compose definitions
        run: |
          docker compose -f infrastructure/docker/docker-compose.dev.yml config --quiet
          docker compose -f infrastructure/docker/docker-compose.test.yml config --quiet

      - name: Readiness probe against real infrastructure
        env:
          APP_ENV: test
          NODE_ENV: test
          DATABASE_URL: postgresql://delivery:delivery@localhost:5432/deliveryuy_test
          REDIS_URL: redis://localhost:6379
          JWT_ACCESS_SECRET: ci-access-secret-0123456789abcdef0123456789
          JWT_REFRESH_SECRET: ci-refresh-secret-0123456789abcdef0123456789
          API_PORT: '3000'
          LOG_LEVEL: info
        run: |
          node services/api/dist/main.js &
          API_PID=$!
          for attempt in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:3000/api/v1/health/live" > /dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS "http://127.0.0.1:3000/api/v1/health/live"
          curl -fsS "http://127.0.0.1:3000/api/v1/health/ready"
          kill "$API_PID"
